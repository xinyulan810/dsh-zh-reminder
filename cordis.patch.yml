- insert:
    - id: dsh-zh-reminder
      name: 'dsh-zh-reminder'
      config:
        # 会话开头的中文提醒文本（会话第一个 step 注入一次）
        startReminder: '请始终使用简体中文思考和回答用户的问题，不要使用英文（代码、命令、专有名词除外）。'
        # 抽检到大段英文时的提醒文本
        repeatReminder: '你刚才的回复里有一整段是英文。请改用简体中文重新表述这部分内容——必须用中文思考，也要用中文回答用户。'
        # 逐段抽检：单段文字的英文占比超过该比例即触发提醒
        threshold: 0.8
        # 单段最少字符数（低于该长度不判定，避免噪声误报）
        minChars: 20
        # 单段最少英文字母数（低于该数量不判定）
        minLetters: 8
        # 最多抽检的段落数
        maxChecks: 8
        # 只扫描回复开头这么多字符
        maxScanChars: 2000
